name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate workflows with a verified actionlint release
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check the immutable Apizr publication receipt
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          receipt = json.loads(pathlib.Path('formula-source.json').read_text())
          formula = pathlib.Path('Formula/apizr.rb').read_bytes()
          assert receipt['schema'] == 'apizr.homebrew-formula-source/v1'
          assert receipt['mode'] == 'publication'
          assert re.fullmatch(r'[0-9a-f]{40}', receipt['source_commit'])
          for field in ('formula_sha256', 'source_sha256', 'build_inputs_manifest_sha256'):
              assert re.fullmatch(r'[0-9a-f]{64}', receipt[field]), field
          assert hashlib.sha256(formula).hexdigest() == receipt['formula_sha256']
          version = receipt['version']
          source = f'https://github.com/Alien6-Studio/outerspace-apizr/releases/download/v{version}/outerspace_apizr-{version}.tar.gz'
          assert f'  url "{source}"' in formula.decode()
          assert f'  sha256 "{receipt["source_sha256"]}"' in formula.decode()
          print(f'Apizr {version}: formula and published source match the receipt')
          PY
      - name: Scan the complete Git history for secrets with a verified tool
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --report-format json --report-path "$RUNNER_TEMP/secrets.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-security
          path: ${{ runner.temp }}/secrets.json
          if-no-files-found: warn
          retention-days: 7
